# TimeBack: build patched Electron on the same runner *labels* TimeBack Frontend uses,
# then publish binaries to GitHub Releases and the npm package to GitHub Packages.
#
# Reuses machines only (macos-latest-xlarge / wseng-windows-latest-8vcpu).
# Does NOT reuse Electron upstream publish pipelines or TimeBack app build-template.
#
# Caching (our own, since Electron's Azure src cache + RBE are maintainer-only):
#   src-cache/<platform>/v2-src-cache-<depshash>.tar.zst  → synced Chromium tree
#   out-cache/<platform>-<arch>/<depshash>/                → mirrored out/Release
#   sccache/                                              → compile object cache (opt-in)
# Both live in s3://timeback-electron-src-cache (tbdev, 60-day lifecycle), reached
# via OIDC role TimebackElectronCacheRole which is scoped to this repo + those prefixes.
#
# The src cache is uploaded immediately after a successful sync and BEFORE the compile,
# so a failure hours into the build never costs us the sync again. The compile itself
# runs in timed passes (see script/timeback/build-resumable.sh) that checkpoint
# out/Release to S3 in between, so dying at ninja target 41k of 42k replays only the
# last pass instead of the whole build.
#
# Publish destinations:
#   1) GitHub Releases  → https://github.com/trilogy-group/electron/releases
#      (binaries consumed via ELECTRON_MIRROR / @electron/get)
#   2) GitHub Packages  → @trilogy-group/electron on npm.pkg.github.com
#      (thin npm installer package; install pulls zips from the Release above)

name: TimeBack Build & Publish Electron

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm/release version (override_electron_version)'
        required: true
        default: '43.2.0-timeback.1'
      publish:
        description: 'Create GitHub Release + publish @trilogy-group/electron'
        type: boolean
        default: true
      build_mac:
        description: 'Build macOS (arm64 on macos-latest-xlarge)'
        type: boolean
        default: true
      build_win:
        description: 'Build Windows (x64 on wseng-windows-latest-8vcpu)'
        type: boolean
        default: true
      use_src_cache:
        description: 'Restore/save the Chromium src cache in S3'
        type: boolean
        default: true
      use_out_cache:
        description: 'Checkpoint out/Release to S3 so a failed/timed-out compile resumes'
        type: boolean
        default: true
      snapshot_interval_seconds:
        description: 'Seconds of compiling between out/Release checkpoints'
        default: '4500'
      use_sccache:
        description: 'Also cache compile objects via sccache (unvalidated on official PGO builds)'
        type: boolean
        default: false

# Least privilege: build jobs only read code and mint an OIDC token.
# Release/npm write scopes are granted to the publish job alone.
permissions: {}

concurrency:
  group: timeback-electron-build-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_VERSION: ${{ inputs.version }}
  ELECTRON_OUT_DIR: Release
  # Point @electron/get at this fork's Releases when publishing the npm package.
  TIMEBACK_ELECTRON_MIRROR: https://github.com/trilogy-group/electron/releases/download/
  CACHE_BUCKET: ${{ vars.ELECTRON_CACHE_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_MAX_ATTEMPTS: '5'
  OUT_DIR: src/out/Release
  USE_OUT_CACHE: ${{ inputs.use_out_cache }}
  SNAPSHOT_INTERVAL_SECONDS: ${{ inputs.snapshot_interval_seconds }}

jobs:
  build-mac:
    if: ${{ inputs.build_mac }}
    name: Build macOS arm64
    runs-on: macos-latest-xlarge
    timeout-minutes: 720
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_PLATFORM: macos
      TARGET_ARCH: arm64
    steps:
      - name: Create src dir
        run: mkdir -p src

      - name: Checkout Electron (patched branch)
        uses: actions/checkout@v4
        with:
          path: src/electron
          fetch-depth: 0

      - name: Show patch set under build
        run: |
          cd src/electron
          echo "HEAD: $(git rev-parse --short HEAD)"
          tail -n 8 patches/chromium/.patches

      - name: Free disk space (macOS)
        uses: ./src/electron/.github/actions/free-space-macos

      - name: Check disk
        run: df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.x'

      - name: Ensure zstd
        run: command -v zstd || brew install zstd

      - name: Install Dependencies
        uses: ./src/electron/.github/actions/install-dependencies

      - name: Install Build Tools
        uses: ./src/electron/.github/actions/install-build-tools

      - name: Generate DEPS hash
        run: |
          set -euo pipefail
          node src/electron/script/generate-deps-hash.js
          DEPSHASH="v2-src-cache-$(cat src/electron/.depshash)"
          echo "DEPSHASH=$DEPSHASH" >> "$GITHUB_ENV"
          echo "CACHE_KEY=src-cache/${TARGET_PLATFORM}/${DEPSHASH}.tar.zst" >> "$GITHUB_ENV"
          echo "OUT_CACHE_PREFIX=out-cache/${TARGET_PLATFORM}-${TARGET_ARCH}/${DEPSHASH}/" >> "$GITHUB_ENV"
          echo "Cache key: src-cache/${TARGET_PLATFORM}/${DEPSHASH}.tar.zst"

      - name: Configure AWS credentials from OIDC
        if: ${{ inputs.use_src_cache || inputs.use_out_cache || inputs.use_sccache }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Check src cache
        id: src-cache
        run: |
          set -uo pipefail
          if [ "${{ inputs.use_src_cache }}" != "true" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Src cache disabled for this run"
            exit 0
          fi
          if aws s3api head-object --bucket "$CACHE_BUCKET" --key "$CACHE_KEY" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache HIT for $CACHE_KEY"
          else
            # An earlier run may have finished uploading but died before promoting
            # its temp key. Adopt the newest such object rather than cold-syncing.
            # `aws s3 ls` prints basenames, so re-attach the key's directory.
            ORPHAN=$(aws s3 ls "s3://$CACHE_BUCKET/${CACHE_KEY}.upload-" 2>/dev/null \
              | sort | tail -1 | awk '{print $4}')
            if [ -n "$ORPHAN" ]; then
              ORPHAN="$(dirname "$CACHE_KEY")/$ORPHAN"
              echo "Adopting orphaned upload $ORPHAN"
              aws s3 mv "s3://$CACHE_BUCKET/$ORPHAN" "s3://$CACHE_BUCKET/$CACHE_KEY"
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "Cache HIT (recovered orphan) for $CACHE_KEY"
            else
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "Cache MISS for $CACHE_KEY"
            fi
          fi

      - name: Init build config
        run: |
          set -euo pipefail
          # -f allows a non-empty root (src/electron is already checked out).
          e init -f timeback-mac \
            --root="$(pwd)" \
            --out=Release \
            -i release \
            --remote-build none \
            --use-https

      # --- Cache HIT path: restore the synced tree, then run Electron-only hooks ---
      - name: Restore src cache
        if: steps.src-cache.outputs.hit == 'true'
        run: |
          set -euo pipefail
          # Streamed straight into tar; the tarball deliberately excludes
          # src/electron, so our checkout survives.
          aws s3 cp "s3://$CACHE_BUCKET/$CACHE_KEY" - | zstd -d --long=30 -c | tar -xf - -C .
          test -d src/third_party/blink || { echo "Cache restore incomplete"; exit 1; }
          echo "Restored src: $(du -sh src | cut -f1)"

      - name: Run Electron-only hooks (cache hit)
        if: steps.src-cache.outputs.hit == 'true'
        run: |
          e d gclient runhooks --spec="solutions=[{'name':'src/electron','url':None,'deps_file':'DEPS','custom_vars':{'process_deps':False},'managed':False}]"

      # Release builds need Electron's PGO profiles. The hooks above run with
      # process_deps=False, which skips the gclient hook that downloads them.
      - name: Download PGO profiles (cache hit)
        if: steps.src-cache.outputs.hit == 'true'
        run: |
          python3 src/electron/script/pgo/download-profiles.py \
            --targets "${TARGET_PLATFORM}-${TARGET_ARCH},v8-builtins"

      # --- Cache MISS path: full sync, then persist the tree before compiling ---
      - name: Sync (gclient + apply Chromium patches)
        if: steps.src-cache.outputs.hit != 'true'
        run: e sync -f
        env:
          DEPOT_TOOLS_UPDATE: '0'

      - name: Save src cache
        if: ${{ steps.src-cache.outputs.hit != 'true' && inputs.use_src_cache }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Mirror upstream's cache shape: drop .git dirs (except angle/dawn, whose
          # HEAD files feed generated headers) and the heaviest unused test data.
          find src -type d -name .git \
            -not -path 'src/third_party/angle/*' \
            -not -path 'src/third_party/dawn/*' \
            -not -path 'src/electron/*' > /tmp/cache-excludes
          cat >> /tmp/cache-excludes <<'EOF'
          src/electron
          src/android_webview
          src/ios/chrome
          src/third_party/blink/perf_tests
          src/chrome/test/data/xr/webvr_info
          src/third_party/angle/third_party/VK-GL-CTS/src
          src/third_party/swift-toolchain
          src/third_party/swiftshader/tests/regres/testlists
          EOF
          SRC_KB=$(du -sk src | cut -f1)
          echo "Uncompressed src: $(( SRC_KB / 1024 )) MiB"
          # Upload to a run-unique temp key first so a concurrent reader never sees
          # a partial object, then promote it. Streamed, so the tarball itself never
          # needs disk next to the checkout.
          TMP_KEY="${CACHE_KEY}.upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -cf - --exclude-from=/tmp/cache-excludes src \
            | zstd -T0 --long=30 -c \
            | aws s3 cp - "s3://$CACHE_BUCKET/$TMP_KEY" --expected-size "$(( SRC_KB * 1024 ))"
          if aws s3api head-object --bucket "$CACHE_BUCKET" --key "$CACHE_KEY" >/dev/null 2>&1; then
            echo "Another run already published this key; discarding ours"
            aws s3 rm "s3://$CACHE_BUCKET/$TMP_KEY"
          else
            aws s3 mv "s3://$CACHE_BUCKET/$TMP_KEY" "s3://$CACHE_BUCKET/$CACHE_KEY"
            echo "Persisted $CACHE_KEY"
          fi

      # --- Compile ---
      - name: Setup sccache
        if: ${{ inputs.use_sccache }}
        run: |
          set -euo pipefail
          command -v sccache || brew install sccache
          echo "SCCACHE_BUCKET=$CACHE_BUCKET" >> "$GITHUB_ENV"
          echo "SCCACHE_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_KEY_PREFIX=sccache/${TARGET_PLATFORM}-${TARGET_ARCH}" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
          echo "GN_CC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          sccache --start-server
          sccache --show-stats

      - name: Add CHROMIUM_BUILDTOOLS_PATH to env
        run: echo "CHROMIUM_BUILDTOOLS_PATH=$(pwd)/src/buildtools" >> "$GITHUB_ENV"

      # Restores the last out/Release checkpoint, then compiles in timed passes,
      # uploading a new checkpoint between each one and on failure.
      - name: Build Electron (release, resumable)
        id: build
        run: bash src/electron/script/timeback/build-resumable.sh

      # The script checkpoints its own failures; this covers a cancel or a job
      # timeout, where it never gets to return.
      - name: Checkpoint out dir (cancelled)
        if: ${{ cancelled() && inputs.use_out_cache }}
        run: bash src/electron/script/timeback/out-cache.sh save

      - name: sccache stats
        if: ${{ always() && inputs.use_sccache }}
        run: sccache --show-stats || true

      - name: Package dist.zip
        run: |
          set -euo pipefail
          OUT="$OUT_DIR"
          test -d "$OUT" || OUT="src/out/Default"
          echo "OUT=$OUT"
          ninja -C "$OUT" electron:electron_dist_zip
          ARTIFACT="electron-v${ELECTRON_VERSION}-darwin-${TARGET_ARCH}.zip"
          mkdir -p artifacts
          cp "$OUT/dist.zip" "artifacts/$ARTIFACT"
          ls -lh artifacts

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-darwin-arm64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  build-win:
    if: ${{ inputs.build_win }}
    name: Build Windows x64
    runs-on: wseng-windows-latest-8vcpu
    timeout-minutes: 720
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TARGET_PLATFORM: win
      TARGET_ARCH: x64
    steps:
      - name: Configure git for Windows Chromium
        run: |
          git config --global core.filemode false
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global core.fscache true
          git config --global core.preloadindex true

      - name: Create src dir
        run: mkdir -p src

      - name: Checkout Electron (patched branch)
        uses: actions/checkout@v4
        with:
          path: src/electron
          fetch-depth: 0

      - name: Show patch set under build
        run: |
          cd src/electron
          echo "HEAD: $(git rev-parse --short HEAD)"
          tail -n 8 patches/chromium/.patches

      - name: Check disk / toolchain
        run: |
          df -h || true
          echo "VS installs:"
          ls "/c/Program Files/Microsoft Visual Studio" 2>/dev/null \
            || ls "/c/Program Files (x86)/Microsoft Visual Studio" 2>/dev/null \
            || echo "No Visual Studio found"
          python3 --version || python --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.x'

      - name: Ensure zstd and AWS CLI
        run: |
          set -euo pipefail
          command -v zstd || choco install zstd -y --no-progress
          command -v aws || choco install awscli -y --no-progress
          command -v zstd && zstd --version
          command -v aws && aws --version

      - name: Install Dependencies
        uses: ./src/electron/.github/actions/install-dependencies

      - name: Install Build Tools
        uses: ./src/electron/.github/actions/install-build-tools

      - name: Generate DEPS hash
        run: |
          set -euo pipefail
          node src/electron/script/generate-deps-hash.js
          DEPSHASH="v2-src-cache-$(cat src/electron/.depshash)"
          echo "DEPSHASH=$DEPSHASH" >> "$GITHUB_ENV"
          echo "CACHE_KEY=src-cache/${TARGET_PLATFORM}/${DEPSHASH}.tar.zst" >> "$GITHUB_ENV"
          echo "OUT_CACHE_PREFIX=out-cache/${TARGET_PLATFORM}-${TARGET_ARCH}/${DEPSHASH}/" >> "$GITHUB_ENV"
          echo "Cache key: src-cache/${TARGET_PLATFORM}/${DEPSHASH}.tar.zst"

      - name: Configure AWS credentials from OIDC
        if: ${{ inputs.use_src_cache || inputs.use_out_cache || inputs.use_sccache }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200

      - name: Check src cache
        id: src-cache
        run: |
          set -uo pipefail
          if [ "${{ inputs.use_src_cache }}" != "true" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Src cache disabled for this run"
            exit 0
          fi
          if aws s3api head-object --bucket "$CACHE_BUCKET" --key "$CACHE_KEY" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache HIT for $CACHE_KEY"
          else
            # An earlier run may have finished uploading but died before promoting
            # its temp key. Adopt the newest such object rather than cold-syncing.
            # `aws s3 ls` prints basenames, so re-attach the key's directory.
            ORPHAN=$(aws s3 ls "s3://$CACHE_BUCKET/${CACHE_KEY}.upload-" 2>/dev/null \
              | sort | tail -1 | awk '{print $4}')
            if [ -n "$ORPHAN" ]; then
              ORPHAN="$(dirname "$CACHE_KEY")/$ORPHAN"
              echo "Adopting orphaned upload $ORPHAN"
              aws s3 mv "s3://$CACHE_BUCKET/$ORPHAN" "s3://$CACHE_BUCKET/$CACHE_KEY"
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "Cache HIT (recovered orphan) for $CACHE_KEY"
            else
              echo "hit=false" >> "$GITHUB_OUTPUT"
              echo "Cache MISS for $CACHE_KEY"
            fi
          fi

      - name: Init build config
        run: |
          set -euo pipefail
          e init -f timeback-win \
            --root="$(pwd)" \
            --out=Release \
            -i release \
            --remote-build none \
            --use-https

      - name: Restore src cache
        if: steps.src-cache.outputs.hit == 'true'
        run: |
          set -euo pipefail
          aws s3 cp "s3://$CACHE_BUCKET/$CACHE_KEY" - | zstd -d --long=30 -c | tar -xf - -C .
          test -d src/third_party/blink || { echo "Cache restore incomplete"; exit 1; }

      - name: Run Electron-only hooks (cache hit)
        if: steps.src-cache.outputs.hit == 'true'
        run: |
          e d gclient runhooks --spec="solutions=[{'name':'src/electron','url':None,'deps_file':'DEPS','custom_vars':{'process_deps':False},'managed':False}]"

      - name: Download PGO profiles (cache hit)
        if: steps.src-cache.outputs.hit == 'true'
        run: |
          python3 src/electron/script/pgo/download-profiles.py \
            --targets "${TARGET_PLATFORM}-${TARGET_ARCH},v8-builtins"

      - name: Sync (gclient + apply Chromium patches)
        if: steps.src-cache.outputs.hit != 'true'
        run: e sync -f
        env:
          DEPOT_TOOLS_UPDATE: '0'

      - name: Save src cache
        if: ${{ steps.src-cache.outputs.hit != 'true' && inputs.use_src_cache }}
        continue-on-error: true
        run: |
          set -euo pipefail
          find src -type d -name .git \
            -not -path 'src/third_party/angle/*' \
            -not -path 'src/third_party/dawn/*' \
            -not -path 'src/electron/*' > /tmp/cache-excludes
          cat >> /tmp/cache-excludes <<'EOF'
          src/electron
          src/android_webview
          src/ios/chrome
          src/third_party/blink/perf_tests
          src/chrome/test/data/xr/webvr_info
          src/third_party/angle/third_party/VK-GL-CTS/src
          src/third_party/swift-toolchain
          src/third_party/swiftshader/tests/regres/testlists
          EOF
          SRC_KB=$(du -sk src | cut -f1)
          TMP_KEY="${CACHE_KEY}.upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -cf - --exclude-from=/tmp/cache-excludes src \
            | zstd -T0 --long=30 -c \
            | aws s3 cp - "s3://$CACHE_BUCKET/$TMP_KEY" --expected-size "$(( SRC_KB * 1024 ))"
          if aws s3api head-object --bucket "$CACHE_BUCKET" --key "$CACHE_KEY" >/dev/null 2>&1; then
            aws s3 rm "s3://$CACHE_BUCKET/$TMP_KEY"
          else
            aws s3 mv "s3://$CACHE_BUCKET/$TMP_KEY" "s3://$CACHE_BUCKET/$CACHE_KEY"
            echo "Persisted $CACHE_KEY"
          fi

      - name: Setup sccache
        if: ${{ inputs.use_sccache }}
        run: |
          set -euo pipefail
          command -v sccache || choco install sccache -y --no-progress
          echo "SCCACHE_BUCKET=$CACHE_BUCKET" >> "$GITHUB_ENV"
          echo "SCCACHE_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_KEY_PREFIX=sccache/${TARGET_PLATFORM}-${TARGET_ARCH}" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
          echo "GN_CC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
          sccache --start-server
          sccache --show-stats

      - name: Add CHROMIUM_BUILDTOOLS_PATH to env
        run: echo "CHROMIUM_BUILDTOOLS_PATH=$(pwd)/src/buildtools" >> "$GITHUB_ENV"

      - name: Build Electron (release, resumable)
        id: build
        run: bash src/electron/script/timeback/build-resumable.sh

      - name: Checkpoint out dir (cancelled)
        if: ${{ cancelled() && inputs.use_out_cache }}
        run: bash src/electron/script/timeback/out-cache.sh save

      - name: sccache stats
        if: ${{ always() && inputs.use_sccache }}
        run: sccache --show-stats || true

      - name: Package dist.zip
        run: |
          set -euo pipefail
          OUT="$OUT_DIR"
          test -d "$OUT" || OUT="src/out/Default"
          ninja -C "$OUT" electron:electron_dist_zip
          ARTIFACT="electron-v${ELECTRON_VERSION}-win32-${TARGET_ARCH}.zip"
          mkdir -p artifacts
          cp "$OUT/dist.zip" "artifacts/$ARTIFACT"
          ls -lh artifacts

      - name: Upload win artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-win32-x64
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release + npm
    needs: [build-mac, build-win]
    if: ${{ always() && inputs.publish && (needs.build-mac.result == 'success' || needs.build-win.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout npm package sources
        uses: actions/checkout@v4
        with:
          path: electron

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-zips
          pattern: electron-*
          merge-multiple: true

      - name: List artifacts
        run: |
          find dist-zips -type f -print
          ls -lah dist-zips

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${ELECTRON_VERSION}"
          TITLE="TimeBack Electron ${ELECTRON_VERSION}"
          NOTES="Patched Electron build for TimeBack (five Chromium crash patches).

          ## Install (npm / GitHub Packages)
          \`\`\`bash
          npm install @trilogy-group/electron@${ELECTRON_VERSION} --registry=https://npm.pkg.github.com
          \`\`\`

          Or keep \`electron@${ELECTRON_VERSION}\` and set:
          \`\`\`
          ELECTRON_MIRROR=https://github.com/trilogy-group/electron/releases/download/
          \`\`\`

          Branch: \`${{ github.ref_name }}\`
          Commit: \`${{ github.sha }}\`"

          if gh release view "$TAG" -R trilogy-group/electron >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/replacing assets"
            gh release upload "$TAG" dist-zips/*.zip -R trilogy-group/electron --clobber
          else
            gh release create "$TAG" dist-zips/*.zip \
              -R trilogy-group/electron \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi

      - name: Build checksums.json
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("dist-zips")
          checksums = {}
          for path in sorted(root.glob("*.zip")):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              checksums[path.name] = h.hexdigest()
          pathlib.Path("checksums.json").write_text(json.dumps(checksums, indent=2) + "\n")
          print(json.dumps(checksums, indent=2))
          PY

      - name: Prepare @trilogy-group/electron npm package
        run: |
          set -euo pipefail
          mkdir -p npm-publish
          cp -R electron/npm/. npm-publish/
          cp checksums.json npm-publish/checksums.json

          # Rewrite package.json for GitHub Packages + our mirror.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.ELECTRON_VERSION;
          const mirror = process.env.TIMEBACK_ELECTRON_MIRROR;
          const pkgPath = path.join('npm-publish', 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.name = '@trilogy-group/electron';
          pkg.version = version;
          pkg.repository = {
            type: 'git',
            url: 'git+https://github.com/trilogy-group/electron.git'
          };
          pkg.publishConfig = {
            registry: 'https://npm.pkg.github.com'
          };
          // Ensure install resolves binaries from our Releases even without ELECTRON_MIRROR.
          pkg.config = {
            ...(pkg.config || {}),
            electron_mirror: mirror,
            electron_custom_dir: `v${version}`
          };
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          // Patch install.js to force our mirror (npm config is not always honored by @electron/get).
          const installPath = path.join('npm-publish', 'install.js');
          let install = fs.readFileSync(installPath, 'utf8');
          if (!install.includes('TIMEBACK_MIRROR_INJECTED')) {
            install = install.replace(
              'downloadArtifact({',
              `// TIMEBACK_MIRROR_INJECTED\nprocess.env.ELECTRON_MIRROR = process.env.ELECTRON_MIRROR || '${mirror}';\ndownloadArtifact({`
            );
            fs.writeFileSync(installPath, install);
          }
          console.log('Prepared', pkg.name, pkg.version);
          NODE

          # Need electron.d.ts from the repo for the package files list
          if [ -f electron/electron.d.ts ]; then
            cp electron/electron.d.ts npm-publish/electron.d.ts
          elif [ -f electron/npm/electron.d.ts ]; then
            cp electron/npm/electron.d.ts npm-publish/electron.d.ts
          else
            # Generated during full release; create a stub so pack does not fail if listed.
            echo '// Types generated in official Electron releases; runtime package only.' > npm-publish/electron.d.ts
          fi

          # abi_version may be required by files list
          if [ ! -f npm-publish/abi_version ] && [ -f electron/npm/abi_version ]; then
            cp electron/npm/abi_version npm-publish/abi_version
          elif [ ! -f npm-publish/abi_version ]; then
            echo "0" > npm-publish/abi_version
          fi

          ls -la npm-publish

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.x'
          registry-url: https://npm.pkg.github.com
          scope: '@trilogy-group'

      - name: Publish @trilogy-group/electron
        working-directory: npm-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --access restricted
          echo "Published @trilogy-group/electron@${ELECTRON_VERSION}"
          echo "Binaries: ${TIMEBACK_ELECTRON_MIRROR}v${ELECTRON_VERSION}/"
