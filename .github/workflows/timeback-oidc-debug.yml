# Throwaway diagnostic: prints the iss/sub/aud claims GitHub actually mints for
# this repo, so the AWS role trust policy can be matched to them. Delete once the
# OIDC role assumption works.
name: TimeBack OIDC Debug

on:
  workflow_dispatch:

permissions: {}

jobs:
  claims:
    name: Show OIDC claims
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Print claims (no token, no signature)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ('iss', 'aud', 'sub', 'repository', 'repository_owner', 'ref'):
              print(f"{key} = {claims.get(key)}")
          PY
